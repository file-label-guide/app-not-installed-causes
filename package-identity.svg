<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="Poppins,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How Android decides whether an update can replace an installed app</title>
<desc id="d">Android compares two things between the installed app and the new APK: the package name and the signing certificate. When both match, the update installs. When the package name matches but the certificate differs, Android blocks it and reports a package conflict.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050508"/><stop offset=".48" stop-color="#0b0e0f"/><stop offset="1" stop-color="#223178"/></linearGradient></defs>
<rect width="1200" height="360" rx="16" fill="url(#g)"/>
<text x="48" y="58" font-size="15" font-weight="700" letter-spacing="2" fill="#60a5fa">WHAT ANDROID COMPARES</text>
<rect x="48" y="88" width="530" height="226" rx="14" fill="#101827" stroke="#1f9d55" stroke-width="2"/>
<text x="78" y="136" font-size="24" font-weight="700" fill="#f7f9ff">Update installs</text>
<rect x="76" y="162" width="474" height="48" rx="9" fill="#0b0e0f" stroke="#29334c" stroke-width="1.5"/>
<text x="94" y="193" font-size="17" fill="#f7f9ff">Package name: same</text>
<rect x="76" y="224" width="474" height="48" rx="9" fill="#0b0e0f" stroke="#29334c" stroke-width="1.5"/>
<text x="94" y="255" font-size="17" fill="#f7f9ff">Signing certificate: same</text>
<rect x="622" y="88" width="530" height="226" rx="14" fill="#101827" stroke="#e5484d" stroke-width="2"/>
<text x="652" y="136" font-size="24" font-weight="700" fill="#f7f9ff">Package conflict</text>
<rect x="650" y="162" width="474" height="48" rx="9" fill="#0b0e0f" stroke="#29334c" stroke-width="1.5"/>
<text x="668" y="193" font-size="17" fill="#f7f9ff">Package name: same</text>
<rect x="650" y="224" width="474" height="48" rx="9" fill="#a4262c" stroke="#29334c" stroke-width="1.5"/>
<text x="668" y="255" font-size="17" fill="#f7f9ff">Signing certificate: different</text>
</svg>